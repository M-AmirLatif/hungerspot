  <circle cx="50" cy="50" r="44" fill="#0c0a09" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Stars -->
  <g fill="#f59e0b">
    <polygon points="50,11 51.5,14.5 55,15 52.5,17.5 53,21 50,19 47,21 47.5,17.5 45,15 48.5,14.5" />
    <polygon points="38,14 39.2,16.8 42,17.2 40,19.2 40.4,22 38,20.4 35.6,22 36,19.2 34,17.2 36.8,16.8" />
    <polygon points="62,14 63.2,16.8 66,17.2 64,19.2 64.4,22 62,20.4 59.6,22 60,19.2 58,17.2 60.8,16.8" />
  </g>

  <!-- Speed streaks -->
  <line x1="16" y1="36" x2="28" y2="36" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="42" x2="26" y2="42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="48" x2="25" y2="48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- 'H' -->
  <path d="M30 30 L36 30 L36 40 L45 40 L45 30 L51 30 L51 56 L45 56 L45 45 L36 45 L36 56 L30 56 Z" fill="#f59e0b" />

  <!-- 'S' with Pizza & Burger Elements -->
  <path d="M54 35 C54 31 58 29 65 29 C72 29 76 32 77 36 L71 38 C70 36 68 34 65 34 C61 34 59 35 59 38 C59 41 62 42 67 44 C74 46 78 49 78 54 C78 60 72 63 65 63 C57 63 52 59 51 54 L57 52 C58 55 61 58 65 58 C69 58 72 56 72 53 C72 50 69 49 64 47 C57 45 54 42 54 35 Z" fill="#fbbf24" />

  <!-- Mini Pizza slice -->
