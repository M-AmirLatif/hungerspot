  <!-- Mini Burger -->
  <path d="M60 52 C60 50 66 50 66 52 Z" fill="#f59e0b" />
  <rect x="60" y="53" width="6" height="1.5" rx="0.75" fill="#16a34a" />
  <path d="M60 55 C60 56.5 66 56.5 66 55 Z" fill="#f59e0b" />

  <!-- Plate divider -->
  <rect x="22" y="65" width="56" height="1.5" rx="0.75" fill="#f59e0b" />

  <!-- HUNGER -->
  <text x="50" y="74" fill="#ffffff" font-size="8" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="1.5">HUNGER</text>
  <!-- SPOT -->
  <text x="50" y="82" fill="#f59e0b" font-size="8" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">SPOT</text>
</svg>